name: Android CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install approved Aurelia launcher artwork
        run: bash scripts/install-launcher-icon.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1
      - name: Generate and verify merged debug manifest
        run: |
          ./gradlew processDebugMainManifest
          python3 scripts/verify-merged-manifest.py
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Require production signing secrets
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.AURELIA_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AURELIA_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AURELIA_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AURELIA_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing AURELIA_RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing AURELIA_RELEASE_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing AURELIA_RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing AURELIA_RELEASE_KEY_PASSWORD"; exit 1; }
          mkdir -p "$RUNNER_TEMP/aurelia-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/aurelia-signing/release.jks"
          test -s "$RUNNER_TEMP/aurelia-signing/release.jks"
      - name: Build production-signed release APK
        if: github.event_name != 'pull_request'
        env:
          AURELIA_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/aurelia-signing/release.jks
          AURELIA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.AURELIA_RELEASE_KEYSTORE_PASSWORD }}
          AURELIA_RELEASE_KEY_ALIAS: ${{ secrets.AURELIA_RELEASE_KEY_ALIAS }}
          AURELIA_RELEASE_KEY_PASSWORD: ${{ secrets.AURELIA_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Verify production release APK signature
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.AURELIA_SHARED_CERT_SHA256 }}
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee "$RUNNER_TEMP/aurelia-pay-bridge-certificate.txt"
          expected="${EXPECTED_CERT_SHA256//:/}"
          expected="${expected,,}"
          actual="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}' "$RUNNER_TEMP/aurelia-pay-bridge-certificate.txt")"
          if [[ -z "$expected" ]]; then
            echo "::error::Missing AURELIA_SHARED_CERT_SHA256. Configure the same certificate fingerprint in both PMS and Pay Bridge repository secrets."
            exit 1
          fi
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Pay Bridge signing certificate does not match AURELIA_SHARED_CERT_SHA256."
            exit 1
          fi
      - name: Upload production-signed APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-pay-bridge-production-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            ${{ runner.temp }}/aurelia-pay-bridge-certificate.txt
          retention-days: 1
