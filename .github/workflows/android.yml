name: Android CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify, test and build debug
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1
      - name: Validate merged debug manifest
        run: |
          set -euo pipefail
          ./gradlew --no-daemon processDebugMainManifest
          python3 scripts/verify-merged-manifest.py
      - name: Run JVM unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-pay-bridge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostic build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-pay-bridge-build-diagnostics
          path: |
            app/build/reports/
            app/build/outputs/logs/
            build/reports/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Sign and publish production APK
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1
      - name: Validate production signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.AURELIA_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AURELIA_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AURELIA_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AURELIA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              case "$name" in
                KEYSTORE_B64) secret_name=AURELIA_RELEASE_KEYSTORE_BASE64 ;;
                KEYSTORE_PASSWORD) secret_name=AURELIA_RELEASE_KEYSTORE_PASSWORD ;;
                KEY_ALIAS) secret_name=AURELIA_RELEASE_KEY_ALIAS ;;
                KEY_PASSWORD) secret_name=AURELIA_RELEASE_KEY_PASSWORD ;;
              esac
              echo "::error::Missing or empty GitHub Actions secret: $secret_name"
              exit 1
            fi
          done

          SIGNING_DIR="$RUNNER_TEMP/aurelia-signing"
          KEYSTORE="$SIGNING_DIR/release.jks"
          mkdir -p "$SIGNING_DIR"

          if ! printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"; then
            echo "::error::AURELIA_RELEASE_KEYSTORE_BASE64 is not valid Base64. Re-encode the original PMS keystore file."
            exit 1
          fi
          if [[ ! -s "$KEYSTORE" ]]; then
            echo "::error::Decoded keystore is empty. AURELIA_RELEASE_KEYSTORE_BASE64 must encode the binary keystore file, not its path."
            exit 1
          fi

          if ! keytool -list -keystore "$KEYSTORE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>"$SIGNING_DIR/keytool-error.log"; then
            echo "::error::Keystore could not be opened with the supplied store password and alias. Check the original PMS keystore, store password, and exact alias. Secret values are intentionally not printed."
            sed -E 's/(password|passphrase)[^[:cntrl:]]*/[redacted]/Ig' "$SIGNING_DIR/keytool-error.log" || true
            exit 1
          fi

          echo "Keystore file decoded and alias located. Private-key password will be verified by the signed Gradle release build."
      - name: Build production-signed release APK
        env:
          AURELIA_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/aurelia-signing/release.jks
          AURELIA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.AURELIA_RELEASE_KEYSTORE_PASSWORD }}
          AURELIA_RELEASE_KEY_ALIAS: ${{ secrets.AURELIA_RELEASE_KEY_ALIAS }}
          AURELIA_RELEASE_KEY_PASSWORD: ${{ secrets.AURELIA_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Verify APK package and signature
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-pay-bridge-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish draft production-signed release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: app/build/outputs/apk/release/app-release.apk
          RELEASE_TAG: pay-bridge-build-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -s "$APK_PATH"
          gh release create "$RELEASE_TAG" "$APK_PATH#Aurelia Pay Bridge production-signed APK" \
            --draft \
            --prerelease \
            --title "Aurelia Pay Bridge build ${{ github.run_number }}" \
            --notes "Automated production-signed APK. Source commit: ${{ github.sha }}. APK signature verification completed in this workflow. Draft release for controlled testing; provider execution and real-device payment certification remain separate requirements."
      - name: Upload release diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-pay-bridge-release-diagnostics
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
